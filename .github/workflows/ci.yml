name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: TypeScript typecheck
        run: npm run typecheck

      # Advisory only: expo-doctor currently fails on a non-square app icon.
      # Keep this visible in logs without blocking merges.
      - name: Expo config & dependency check
        run: npx expo-doctor
        continue-on-error: true

      - name: Build web bundle
        run: npx expo export --platform web
