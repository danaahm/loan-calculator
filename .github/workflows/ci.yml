name: CI

# Pull requests only. GitHub runs this against the merge of the branch into
# main, so a green PR has already checked what main will become - running it
# again on the merge commit repeats the same work.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: TypeScript typecheck
        run: npm run typecheck

      # The loan and reminder maths are what users trust most, so a wrong
      # number here blocks the merge rather than reaching a release.
      - name: Unit tests
        run: npm test -- --ci

      # Advisory only: expo-doctor currently fails on a non-square app icon.
      # Keep this visible in logs without blocking merges.
      - name: Expo config & dependency check
        run: npx expo-doctor
        continue-on-error: true

      - name: Build web bundle
        run: npx expo export --platform web
