name: Android Release

# Builds a production Android App Bundle (.aab) and submits it to Google Play,
# with the "What's new" text from release-notes/<version>/.
# The build runs locally on the GitHub runner (eas build --local), so it uses
# free public-repo Actions minutes and does NOT consume EAS cloud build credits.
#
# Triggers are intentionally limited to version tags and manual runs. Both
# require write/admin access, and neither runs for pull requests from forks,
# so the repository secrets below are never exposed to outside contributors.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track to submit to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-submit:
    name: Build AAB and submit to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the two-hour build so a wrong tag or missing notes fails in
      # seconds. A manual run has no tag to check; it releases app.json's version.
      - name: Check tag and release notes
        id: release
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            node scripts/release-notes.mjs check --tag "$REF_NAME"
          else
            node scripts/release-notes.mjs check
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}

      # The preinstalled SDK is huge; delete it, then recreate the default
      # ANDROID_HOME parent so setup-android can write without root.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/share/powershell
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$(id -u):$(id -g)" /usr/local/lib/android
          df -h

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # eas build --local compiles on the runner. Expo SDK 58 / RN 0.88 compile
      # against Android 37 with build-tools 37.0.0 and NDK 27.1 (see
      # react-native/gradle/libs.versions.toml); Skia charts need the NDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and platforms
        run: |
          sdkmanager --install \
            "ndk;27.1.12297006" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android app bundle (local, no EAS build credits)
        run: eas build --local --non-interactive --platform android --profile production --output app.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      # eas submit cannot send release notes, so the upload goes through the
      # Play Developer API directly. Pinned to a commit: this step holds the
      # Play service account key.
      - name: Submit to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          packageName: com.danaa.loancalculator
          releaseFiles: app.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          whatsNewDirectory: ${{ steps.release.outputs.notes_dir }}
