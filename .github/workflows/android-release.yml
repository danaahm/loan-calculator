name: Android Release

# Builds a production Android App Bundle (.aab) and submits it to Google Play.
# The build runs locally on the GitHub runner (eas build --local), so it uses
# free public-repo Actions minutes and does NOT consume EAS cloud build credits.
#
# Triggers are intentionally limited to version tags and manual runs. Both
# require write/admin access, and neither runs for pull requests from forks,
# so the repository secrets below are never exposed to outside contributors.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track to submit to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-submit:
    name: Build AAB and submit to Google Play
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Write Google Play service account key
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

      - name: Build Android app bundle (local, no EAS build credits)
        run: eas build --local --non-interactive --platform android --profile production --output app.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play
        run: eas submit --non-interactive --platform android --profile "${SUBMIT_PROFILE}" --path app.aab
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUBMIT_PROFILE: ${{ github.event.inputs.track || 'internal' }}

      - name: Remove service account key
        if: always()
        run: rm -f service-account.json
