name: Deploy Privacy Policy

# The hosted policy is a static-assets Worker ("slc"). Before this workflow it
# was deployed by hand from the Cloudflare dashboard, which is how the live
# page sat six months behind the app.
on:
  push:
    branches: [main]
    paths:
      - 'PRIVACY_POLICY.md'
      - 'docs/**'
      - 'scripts/build-privacy-policy.mjs'
      - 'scripts/privacy-policy.template.html'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-privacy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-privacy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The generator has no dependencies, so this needs no npm install.
      # A page that has drifted from the Markdown must never reach production.
      - name: Privacy policy page is in sync
        run: npm run check:privacy

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
